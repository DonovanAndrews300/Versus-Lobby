version: "3"

services:
  redis:
    image: redis:alpine
    container_name: jitsi-redis-client
    restart: always

  server:
    build: ./server
    container_name: jitsi-server
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      REDIS_PORT: 6379

    depends_on:
      - redis

  client:
    build: ./client
    container_name: jitsi-client
    restart: always
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=https://client:3000
    depends_on:
      - server