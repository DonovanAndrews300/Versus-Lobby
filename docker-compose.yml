version: "3"

services:
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: always
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  redis:
    image: redis:alpine
    container_name: redis-client
    restart: always
    networks:
      - app-network

  peerjs:
    build: ./peer-server
    container_name: peer-server
    restart: always
    expose:
      - "4000"
    networks:
      - app-network

  server:
    build: ./server
    container_name: server
    restart: always
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - redis
    networks:
      - app-network

  client:
    build: ./client
    container_name: client
    restart: always
    expose:
      - "5173"
    depends_on:
      - server
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "8083:80"
    restart: always
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - client
      - server
    networks:
      - app-network
      - proxy

networks:
  app-network:
    driver: bridge
  proxy:
    external: true
